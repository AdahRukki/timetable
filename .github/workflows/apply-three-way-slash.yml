name: Verify three-way slash support

on:
  push:
    branches:
      - jss-class-split
    paths:
      - scripts/refine-three-way-slash.py
      - .github/workflows/apply-three-way-slash.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: jss-class-split
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply three-way slash refinements
        run: python3 scripts/refine-three-way-slash.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Commit verified refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes.ts client/src/lib/timetable-utils.ts client/src/pages/settings.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Harden three-way slash scheduling"
          git push origin HEAD:jss-class-split
