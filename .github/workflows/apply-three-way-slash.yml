name: Apply three-way slash support

on:
  push:
    branches:
      - jss-class-split
    paths:
      - scripts/apply-three-way-slash.py
      - scripts/fix-three-way-slash-patch.py
      - .github/workflows/apply-three-way-slash.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: jss-class-split
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply three-way slash patch
        run: python3 scripts/apply-three-way-slash.py

      - name: Clean patch boundaries
        run: python3 scripts/fix-three-way-slash-patch.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/schema.ts server/storage.ts server/routes.ts client/src/lib/timetable-utils.ts client/src/pages/settings.tsx client/src/pages/home.tsx client/src/pages/shared-timetable.tsx client/src/components/timetable/placement-dialog.tsx client/src/components/timetable/subject-tracker.tsx client/src/components/timetable/timetable-grid.tsx client/src/components/timetable/timetable-cell.tsx client/src/components/timetable/stats-header.tsx scripts/migrate-three-way-slash.sql
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Support three-way slash subject groups"
          git push origin HEAD:jss-class-split
