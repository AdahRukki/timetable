name: Verify SS2 slash daily-repeat fix

on:
  push:
    branches:
      - jss-class-split
    paths:
      - scripts/fix-ss2-slash-repeat.py
      - .github/workflows/fix-ss2-slash-repeat.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: jss-class-split
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply slash repeat fix
        run: python3 scripts/fix-ss2-slash-repeat.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Prevent repeated slash subjects in one day"
          git push origin HEAD:jss-class-split
