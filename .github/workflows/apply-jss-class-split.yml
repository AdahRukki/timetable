name: Apply JSS class split

on:
  push:
    branches:
      - jss-class-split
    paths:
      - scripts/apply-jss-class-split.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: jss-class-split
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply JSS class split
        run: python3 scripts/apply-jss-class-split.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/schema.ts server/storage.ts server/routes.ts client/src/pages/settings.tsx scripts/migrate-jss-class-quotas.sql
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Split JSS1 JSS2 JSS3 timetable configuration"
          git push origin HEAD:jss-class-split
